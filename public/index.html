<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('dm_theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <meta charset="utf-8">

  <title>WharfMaster</title>
  <link rel="icon" href="/public/img/wharfmaster-mark.png" type="image/png">

  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
