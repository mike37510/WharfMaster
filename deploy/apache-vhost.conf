# Exemple VirtualHost WharfMaster
# 1. Cloner le dépôt dans /var/www/wharfmaster
# 2. Copier/adapter ce fichier vers /etc/apache2/sites-available/wharfmaster.conf
# 3. a2enmod rewrite headers && a2ensite wharfmaster && systemctl reload apache2

<VirtualHost *:80>
    ServerName dock.example.com
    DocumentRoot /var/www/wharfmaster

    <Directory /var/www/wharfmaster>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/wharfmaster-error.log
    CustomLog ${APACHE_LOG_DIR}/wharfmaster-access.log combined
</VirtualHost>
