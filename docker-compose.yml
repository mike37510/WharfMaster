# WharfMaster — installation rapide
#
#   DOCKER_GID=$(stat -c '%g' /var/run/docker.sock) docker compose up -d --build
#   → http://localhost:9000/app
#
# Première visite : créer le compte administrateur.
# DocumentRoot = public/ uniquement ; données dans le volume var/.

services:
  wharfmaster:
    build: .
    image: wharfmaster:2.3.5
    pull_policy: build
    container_name: wharfmaster
    restart: unless-stopped
    ports:
      - "${WHARFMASTER_PORT:-9000}:80"
    environment:
      DOCKER_SOCKET: /var/run/docker.sock
      DOCKER_API_VERSION: ${DOCKER_API_VERSION:-v1.45}
      WHARFMASTER_VAR: /var/www/html/var
      # WHARFMASTER_AGENT_IMAGE: ghcr.io/mike37510/wharfmaster-agent:2.3.5
    volumes:
      # Persistance : SQLite, stacks Compose, Dockerfiles, JWT
      - wharfmaster-data:/var/www/html/var
      - ${DOCKER_SOCK_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"

  scheduler:
    image: curlimages/curl:8.11.1
    container_name: wharfmaster-scheduler
    restart: unless-stopped
    # var/ est chmod 700 www-data — root peut lire la clé API
    user: "0"
    depends_on:
      - wharfmaster
    environment:
      WHARFMASTER_INTERNAL_URL: http://wharfmaster
      SCHEDULER_KEY_FILE: /data/scheduler.api_key
    volumes:
      - wharfmaster-data:/data:ro
    # Inline (pas de bind-mount fichier hôte) — évite les échecs DinD / chemins relatifs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        BASE="$${WHARFMASTER_INTERNAL_URL:-http://wharfmaster}"
        KEY_FILE="$${SCHEDULER_KEY_FILE:-/data/scheduler.api_key}"
        echo "[scheduler] waiting for API key at $${KEY_FILE}"
        i=0
        while [ ! -f "$$KEY_FILE" ]; do
          i=$$((i + 1))
          if [ "$$i" -gt 120 ]; then
            echo "[scheduler] timeout waiting for scheduler.api_key" >&2
            exit 1
          fi
          sleep 2
        done
        echo "[scheduler] ready — polling $${BASE}/api/schedules/run-due every 60s"
        while true; do
          KEY=$$(tr -d '\r\n' < "$$KEY_FILE")
          if [ -n "$$KEY" ]; then
            curl -sS -X POST \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -H "X-API-Key: $${KEY}" \
              -d '{}' \
              "$${BASE}/api/schedules/run-due" || true
          fi
          sleep 60
        done

volumes:
  wharfmaster-data:
