# WharfMaster — installation rapide
#
#   DOCKER_GID=$(stat -c '%g' /var/run/docker.sock) docker compose up -d --build
#   → http://localhost:9000/app
#
# Première visite : créer le compte administrateur.

services:
  wharfmaster:
    build: .
    image: wharfmaster:2.1.0
    container_name: wharfmaster
    restart: unless-stopped
    ports:
      - "${WHARFMASTER_PORT:-9000}:80"
    environment:
      DOCKER_SOCKET: /var/run/docker.sock
      DOCKER_API_VERSION: ${DOCKER_API_VERSION:-v1.45}
      # Image agent proposée dans l’UI Nœuds (optionnel)
      # WHARFMASTER_AGENT_IMAGE: ghcr.io/mike37510/wharfmaster-agent:2.1.0
    volumes:
      # Persistance : SQLite, stacks Compose, Dockerfiles, JWT
      - wharfmaster-data:/var/www/html/data
      # API Docker de l’hôte (override : DOCKER_SOCK_PATH=/var/run/docker.so)
      - ${DOCKER_SOCK_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    # GID du groupe docker hôte (recommandé). Ex. : 999 ou 989
    group_add:
      - "${DOCKER_GID:-999}"

  scheduler:
    image: curlimages/curl:8.11.1
    container_name: wharfmaster-scheduler
    restart: unless-stopped
    depends_on:
      - wharfmaster
    environment:
      WHARFMASTER_INTERNAL_URL: http://wharfmaster
      SCHEDULER_KEY_FILE: /data/scheduler.api_key
    volumes:
      - wharfmaster-data:/data:ro
      - ./deploy/scheduler-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

volumes:
  wharfmaster-data:
