# Active DocumentRoot = public/ for the default site in the container.
<VirtualHost *:80>
    ServerName wharfmaster
    DocumentRoot /var/www/html/public

    # Interactive console WebSocket → console-ws sidecar
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http" early
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/api/websocket/(.*)$ ws://127.0.0.1:9100/api/websocket/$1 [P,L]
    ProxyPass /api/websocket/ ws://127.0.0.1:9100/api/websocket/
    ProxyPassReverse /api/websocket/ ws://127.0.0.1:9100/api/websocket/

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
