# WharfMaster — DocumentRoot = public/ uniquement
# Docker : inclus depuis docker/apache-wharfmaster.conf
# Bare metal : adapter les chemins puis a2ensite

<VirtualHost *:80>
    ServerName wharfmaster
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Rien d’autre n’est servi (src/, config/, var/, agent/, … hors DocumentRoot)
    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /var/www/html/public>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/wharfmaster-error.log
    CustomLog ${APACHE_LOG_DIR}/wharfmaster-access.log combined
</VirtualHost>
